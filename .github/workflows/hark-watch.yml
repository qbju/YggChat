name: hark-watch
# Hark定期タスクから移した監視。変化があるとIssueで@qbjuに通知。状態は watch-state ブランチに保存。
on:
  schedule:
    - cron: "44 0,6,12,18 * * *"   # F-Droid MR !53716 every 6h
    - cron: "0 1 * * *"             # YggChat browser peers daily 10:00 JST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: hark-watch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_DIR: st
    steps:
      - uses: actions/checkout@v4
      - name: state branch
        run: git fetch origin watch-state && git worktree add st origin/watch-state
      - name: F-Droid MR
        if: github.event.schedule != '0 1 * * *'
        run: python3 .github/watchers/fdroid_mr.py
      - name: YggChat peers
        if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
        run: python3 .github/watchers/ygg_peers.py
      - name: save state
        if: always()
        run: |
          cd st
          git config user.name github-actions; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A; git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push origin HEAD:watch-state)
