name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and uploads an artifact only; pull_request runs must not get a token
# that can write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_KEY: ${{ secrets.KEYSTORE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Signing key
        run: |
          if [ -n "$KS_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_KEY -in android/yggchat.jks.enc -out "$RUNNER_TEMP/yggchat.jks"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_KEY is not set: the APK is signed with a throwaway key and cannot update an installed YggChat."
          fi
          echo "YGG_KEYSTORE=$RUNNER_TEMP/yggchat.jks" >> "$GITHUB_ENV"

      - name: Build (wasm, Linux, Windows, macOS, FreeBSD, Android, APK)
        env:
          YGG_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'yggchat' }}
          REQUIRE_NDK: '1'
        run: |
          # APK ABIs other than arm64-v8a need the NDK (preinstalled on the runner image).
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./rel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yggchat-${{ github.sha }}
          path: pwa/dl/
