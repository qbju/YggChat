name: release

# Attaches the binaries to a GitHub Release. The APK is the one Hark publishes
# on yggchat.surge.sh (signed with the project key), attached only when its
# versionName matches the tag; with the KEYSTORE_KEY secret it is built here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.12.0'
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      KS_KEY: ${{ secrets.KEYSTORE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Build
        run: |
          if [ -n "$KS_KEY" ] && [ -f android/yggchat.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_KEY -in android/yggchat.jks.enc -out "$RUNNER_TEMP/yggchat.jks"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
          export YGG_KEYSTORE="$RUNNER_TEMP/yggchat.jks"
          ./rel.sh

      - name: Use the published APK
        if: env.SIGNED != '1'
        run: |
          rm -f pwa/dl/yggchat.apk
          curl -fsSL -o /tmp/yggchat.apk https://yggchat.surge.sh/dl/yggchat.apk
          V=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging /tmp/yggchat.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "published APK versionName: $V"
          if [ "v$V" = "$TAG" ]; then
            cp /tmp/yggchat.apk pwa/dl/yggchat.apk
          else
            echo "::warning::yggchat.surge.sh has APK $V, not $TAG; the APK is not attached."
          fi
          (cd pwa/dl && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS && cat SHA256SUMS)

      - name: Upload to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "YggChat $TAG" --generate-notes
          gh release upload "$TAG" pwa/dl/* --clobber
