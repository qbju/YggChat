[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yggchat"
version = "0.1.0"
description = "Python SDK for YggChat bots (talks to a local YggChat node)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[tool.setuptools]
packages = ["yggchat"]
